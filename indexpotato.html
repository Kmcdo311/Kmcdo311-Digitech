<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Potato Simulator - Vecta Arcade</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }
    h1 {
      margin: 0 0 5px 0;
      font-size: 28px;
      letter-spacing: 2px;
      color: #eab308;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #timer {
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #333;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #a3a3a3;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 15px;
      border-radius: 10px;
      pointer-events: none;
      user-select: none;
    }
  </style>
  
  <!-- Import Map matching modern Three.js standards to avoid black-screen execution crashes -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>

  <div id="ui-container">
    <h1>POTATO SIMULATOR</h1>
    <div id="timer">Time as Potato: <span id="timeText">00:00</span></div>
  </div>

  <div class="hint">Left-Click & Drag to look around. Scroll to Zoom. You are a potato.</div>

  <!-- Note the type="module" layout context tag -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 1. SETUP 3D WORLD ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0f1115"); 
    scene.fog = new THREE.FogExp2("#0f1115", 0.05);  

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Initializing the modern module controls binding
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 8;
    controls.minDistance = 2;
    controls.target.set(0, 0.5, 0);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight("#ffffff", 0.3); 
    scene.add(ambientLight);

    const kitchenLight = new THREE.PointLight("#fff1e0", 1.5, 20); 
    kitchenLight.position.set(2, 5, 2);
    kitchenLight.castShadow = true;
    scene.add(kitchenLight);

    // --- 3. THE KITCHEN ENVIRONMENT ---
    const counterGeo = new THREE.BoxGeometry(10, 1, 10);
    const counterMat = new THREE.MeshStandardMaterial({ color: "#22252a", roughness: 0.2 }); 
    const countertop = new THREE.Mesh(counterGeo, counterMat);
    countertop.position.y = -0.5;
    countertop.receiveShadow = true;
    scene.add(countertop);

    const wallGeo = new THREE.PlaneGeometry(10, 8);
    const wallMat = new THREE.MeshStandardMaterial({ color: "#3a4146", roughness: 0.5 }); 
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(0, 3, -4);
    wall.receiveShadow = true;
    scene.add(wall);

    // --- 4. THE POTATO ---
    const potatoGeo = new THREE.SphereGeometry(0.6, 16, 16);
    
    const positionAttribute = potatoGeo.attributes.position;
    for (let i = 0; i < positionAttribute.count; i++) {
      let x = positionAttribute.getX(i);
      let y = positionAttribute.getY(i);
      let z = positionAttribute.getZ(i);
      
      x *= 1.4 + (Math.random() * 0.15);
      y *= 0.9 + (Math.random() * 0.1);
      z *= 1.0 + (Math.random() * 0.15);
      
      positionAttribute.setXYZ(i, x, y, z);
    }
    potatoGeo.computeVertexNormals();

    const potatoMat = new THREE.MeshStandardMaterial({
      color: "#8b5a2b", 
      roughness: 0.9,
      metalness: 0.1
    });

    const potato = new THREE.Mesh(potatoGeo, potatoMat);
    potato.position.set(0, 0.4, 0);
    potato.castShadow = true;
    scene.add(potato);

    // --- 5. TIMER TRACKING SYSTEM ---
    let startTime = Date.now();
    const timeText = document.getElementById("timeText");

    function updateTimer() {
      let elapsedMilliseconds = Date.now() - startTime;
      let totalSeconds = Math.floor(elapsedMilliseconds / 1000);
      
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;

      let displayMin = minutes < 10 ? "0" + minutes : minutes;
      let displaySec = seconds < 10 ? "0" + seconds : seconds;

      timeText.innerText = displayMin + ":" + displaySec;
    }

    // --- 6. ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateTimer();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
