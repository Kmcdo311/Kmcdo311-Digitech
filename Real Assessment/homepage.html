<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecta</title>
  <link rel="icon" type="image/x-icon" href="video-game-icon-png.webp">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Reset & Dark Mode Theme matching reference image */
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Left Sidebar Navigation Layout */
    .sidebar {
      width: 240px;
      background-color: #000000;
      border-right: 1px solid #1a1a1a;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      box-sizing: border-box;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .sidebar-brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Navigation Link with clean theme highlight */
    .menu-link {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: #a3a3a3;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      background-color: #1a1a1a; /* Clean active container style */
      color: #ffffff;
      transition: background-color 0.2s, color 0.2s;
    }

    .menu-link:hover {
      background-color: #262626;
    }

    /* Main Content Panel right next to Sidebar */
    .content-wrapper {
      margin-left: 240px;
      flex: 1;
      padding: 40px 50px;
      box-sizing: border-box;
    }

    /* Header Region Area */
    .dashboard-header {
      margin-bottom: 40px;
      max-width: 1200px;
    }

    .dashboard-header h1 {
      font-size: 48px;
      font-weight: 800;
      margin: 0 0 10px 0;
      letter-spacing: -1px;
      color: #ffffff;
    }

    /* Marquee Setup loops cleanly horizontally */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 25px;
      background: #111;
      padding: 8px 0;
      border-radius: 6px;
      border: 1px solid #222;
    }

    .marquee-container h4 {
      display: inline-block;
      padding-left: 100%;
      animation: marqueeAnimation 15s linear infinite;
      margin: 0;
      font-size: 14px;
      color: #a3a3a3;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes marqueeAnimation {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Search Component */
    .search-container {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      max-width: 600px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #262626;
      border-radius: 8px;
      font-size: 15px;
      background-color: #121212;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #404040;
    }

    .search-button {
      padding: 0 24px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .search-button:hover {
      background-color: #e5e5e5;
    }

    /* Style for Random Button matching design ecosystem */
    .random-button {
      padding: 0 24px;
      background-color: #1a1a1a;
      color: #ffffff;
      border: 1px solid #262626;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .random-button:hover {
      background-color: #262626;
      border-color: #404040;
    }

    /* Asymmetric Masonry Layout Grid Grid Framework */
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 30px;
      max-width: 1200px;
    }

    /* Box Containers matching Godly design aspect */
    .searchable-box {
      background-color: #121212;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* Variable heights for asymmetrical styling look */
    .searchable-box.height-alt .image-frame {
      height: 280px;
    }

    .image-frame {
      height: 210px;
      background-color: #1a1a1a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .info-frame {
      padding: 20px;
      background-color: #121212;
      border-top: 1px solid #1a1a1a;
    }

    /* Clean link overrides removing rainbows */
    .box-link {
      margin: 0;
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      text-align: left;
      transition: color 0.2s;
    }

    /* Card Interactive Animations */
    .searchable-box:hover {
      transform: translateY(-4px);
      border-color: #333333;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .searchable-box:hover img {
      transform: scale(1.08);
      filter: brightness(0.8);
    }
  </style>
</head>
<body>

  <!-- Left Navigation Menu Block -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="video-game-icon-png.webp" alt="Icon">
      <span>Games</span>
    </div>
    <nav class="sidebar-menu">
      <!-- Self Referencing Main Page Target Pointer Link -->
      <a href="homepage.html" class="menu-link">🏠 Main Page</a>
    </nav>
  </aside>

  <!-- Right Dashboard Content Grid Area -->
  <main class="content-wrapper">
    
    <!-- Moving h4 Loop Marquee -->
    <div class="marquee-container">
      <h4>By Kai McDougall • Welcome to Vecta • By Kai McDougall</h4>
    </div>

    <section class="dashboard-header">
      <h1>Vecta Arcade</h1>
    </section>

    <!-- Unified Filter Bar Module Component -->
    <div class="search-container">
      <input type="text" id="boxSearchInput" class="search-input" placeholder="Search game titles...">
      <button onclick="filterBoxes()" class="search-button">Search</button>
      <button onclick="playRandomGame()" class="random-button">🎲 Random Game</button>
    </div>

    <!-- Asymmetric Card Mapping Grid Frame -->
    <div id="gridContainer" class="masonry-grid">

      <!-- Box 1 -->
      <div class="searchable-box">
        <div class="image-frame">
          <img src="Testile.png" alt="Box 1 Image">
        </div>
        <div class="info-frame">
          <a href="Testile.html" class="box-link">Testile</a>
        </div>
      </div>

      <!-- Box 2 (Asymmetric Tall Variant) -->
      <div class="searchable-box height-alt">
        <div class="image-frame">
          <img src="Brickbreaker.png" alt="Box 2 Image">
        </div>
        <div class="info-frame">
          <a href="Brickbreaker.html" class="box-link">Brickbreaker</a>
        </div>
      </div>

      <!-- Box 3 -->
      <div class="searchable-box">
        <div class="image-frame">
          <img src="Dvd.png" alt="Box 3 Image">
        </div>
        <div class="info-frame">
          <a href="Dvd.html" class="box-link">DvD</a>
        </div>
      </div>

      <!-- Box 4 (Asymmetric Tall Variant) -->
      <div class="searchable-box height-alt">
        <div class="image-frame">
          <img src="image4.jpg" alt="Box 4 Image">
        </div>
        <div class="info-frame">
          <a href="page4.html" class="box-link">Click here to open link 4</a>
        </div>
      </div>

            <!-- Box 5 -->
      <div class="searchable-box">
        <div class="image-frame">
          <img src="image5.jpg" alt="Box 1 Image">
        </div>
        <div class="info-frame">
          <a href="page5.html" class="box-link">Click here to open link 5</a>
        </div>
      </div>
    </div>
  </main>

  <!-- JavaScript Filtering Engine -->
  <script>
    function filterBoxes() {
      const query = document.getElementById('boxSearchInput').value.toLowerCase();
      const boxes = document.querySelectorAll('.searchable-box');
      
      boxes.forEach(box => {
        const linkText = box.querySelector('.box-link').textContent.toLowerCase();
        
        if (linkText.includes(query)) {
          box.style.display = "flex";
        } else {
          box.style.display = "none";
        }
      });
    }

    function playRandomGame() {
      const boxes = document.querySelectorAll('.searchable-box');
      if (boxes.length > 0) {
        const randomIndex = Math.floor(Math.random() * boxes.length);
        const randomLink = boxes[randomIndex].querySelector('.box-link');
        if (randomLink) {
          window.location.href = randomLink.getAttribute('href');
        }
      }
    }
  </script>
</body>
</html>
